name: fidel_assistant
description: Compagnon d'accompagnement patient — rappels médicaments, offline-first.
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ^3.5.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_riverpod: ^2.6.1
  dio: ^5.7.0
  flutter_secure_storage: ^9.2.4
  intl: any
  # Auth / onboarding (écrans à venir)
  google_sign_in: ^6.2.2
  # Rappels locaux (câblage alarmes à venir)
  flutter_local_notifications: ^18.0.1
  timezone: ^0.10.0
  # Navigation
  go_router: ^14.6.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
